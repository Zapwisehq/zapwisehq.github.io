<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAPWISE//OS</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="ZAPWISE//OS: one full-screen home for your clock, weather, markets, map and apps.">
<meta name="theme-color" content="#070814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZAP//OS">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/os/manifest.webmanifest">
<link rel="apple-touch-icon" href="/os/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/os/icon-192.png">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://api.coingecko.com" crossorigin>
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
<link rel="stylesheet" href="/os/app.css?v=3.1.0">
<script>try{var z=JSON.parse(localStorage.getItem("zapos.device")||"{}").themeCss;if(z&&z.css){var s=document.createElement("style");s.textContent=z.css;document.head.appendChild(s);if(z.light)document.documentElement.classList.add("light");var m=document.querySelector('meta[name="theme-color"]');if(m&&z.meta)m.setAttribute("content",z.meta);}}catch(e){}</script>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div id="app">

 <header class="top" id="top">
  <div class="brand">ZAPWISE<b>//OS</b> <span class="ver">v3.1</span></div>
  <div class="top-r">
   <span class="sync" id="hSync"><i aria-hidden="true"></i>SYNCED</span>
   <button class="h-theme" data-theme-btn aria-label="Change theme" title="Change theme"><i aria-hidden="true"></i>THEME</button>
   <button class="avatar" id="menuBtn" aria-label="Open menu" title="Menu">☰</button>
  </div>
 </header>

 <main>
 <section class="view" id="v-home" aria-label="Home">

  <form class="h-srch" id="srch" role="search" autocomplete="off">
   <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
   <input id="srchQ" type="search" enterkeyhint="go" placeholder="Search apps or the web." aria-label="Search apps or the web" autocapitalize="off" spellcheck="false">
   <span class="srch-h" id="srchHint" aria-hidden="true"><kbd>⌘</kbd>K</span>
  </form>

  <div class="row2">
   <div class="card br hero">
    <div class="h-clock" id="hClock" aria-live="off">--:--<em id="hAmpm"></em></div>
    <div class="h-date" id="hDate">—</div>
    <div class="hero-bot">
     <span class="greet" id="greet">Good evening</span>
     <button class="mode-chip" id="workMode" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11H4zM8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>WORK MODE</button>
    </div>
   </div>

   <div class="card br play" id="hPlay">
    <div class="np-top"><span>NOW PLAYING</span><span class="np-live" id="npLive">MUSIC</span></div>
    <div class="np-body">
     <img class="np-art" id="npArt" src="/os/icons/music.jpg" alt="">
     <div class="np-meta"><b id="npTitle">Choose a music app</b><small id="npArtist">Tap play to open</small></div>
    </div>
    <div class="np-bar"><i id="npBar" style="width:0%"></i></div>
    <div class="np-ctrl">
     <span class="np-t" id="npCur">0:00</span>
     <div class="np-btns">
      <button type="button" data-media-act="prev" aria-label="Previous / switch app">⏮</button>
      <button type="button" class="np-play" data-media-act="play" aria-label="Open music app">▶</button>
      <button type="button" data-media-act="next" aria-label="Next music app">⏭</button>
     </div>
     <span class="np-t" id="npDur">—</span>
    </div>
   </div>
  </div>

  <button class="card br h-wx" id="hWx" type="button" aria-label="Show more weather" aria-expanded="false" aria-controls="xpWx">
   <canvas class="fx" id="fxHud" aria-hidden="true"></canvas>
   <span class="hw-in">
    <span class="hw-top">
     <span>
      <span class="hw-temp" id="hwTemp">--°</span>
      <span class="hw-cond" id="hwNow">Weather loading…</span>
      <span class="hw-advice" id="hwAdvice">Tap to set your city or allow location</span>
     </span>
     <span class="hw-ic" id="hwIc" aria-hidden="true">·</span>
    </span>
    <span class="hw-hrs" id="hwHrs" role="list"></span>
    <span class="hw-meta"><span id="hwHL"></span><span id="hwFeels"></span><span id="hwRain"></span><span class="hw-upd" id="hwUpd">UPD --</span></span>
   </span>
  </button>

  <div class="xp" id="xpWx" hidden>
   <div class="xp-h"><b id="xpPlace">WEATHER</b><button class="chip" id="xpCity" type="button">◎ CHANGE CITY</button></div>
   <div class="hours" id="xpHours"></div>
   <div class="days" id="xpDays"></div>
   <p class="note" id="xpNote"></p>
  </div>

  <div class="card br h-map" id="hMap" role="button" tabindex="0" aria-label="Open Maps at my location">
   <div class="map-h"><b id="hPlace">&gt; LOCATING…</b><span id="hGps">GPS --</span></div>
   <div class="map-v" id="mapV">
    <div class="map-tiles" id="mapTiles"></div>
    <i class="map-shade"></i>
    <i class="map-dot" id="mapDot" hidden></i>
    <span class="map-msg" id="mapMsg">LOCATING…</span>
    <a class="map-attr" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap · © CARTO</a>
   </div>
  </div>

  <div class="row2">
   <button class="card br h-mk" id="hMk" type="button" aria-label="Show markets" aria-expanded="false" aria-controls="xpMk">
    <div class="mk-h">MARKETS</div>
    <div class="mk-items" id="hMkList"><span class="dim">Markets loading…</span></div>
    <span class="mk-t" id="hMkT">--</span>
   </button>

   <button class="card br focus-card" id="mFocus" type="button" aria-label="Focus timer: tap to start or pause">
    <div class="mk-h">FOCUS</div>
    <div class="foc-wrap">
     <svg class="foc-svg" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="foc-track" cx="60" cy="60" r="52"/>
      <circle class="foc-ring" id="focRing" cx="60" cy="60" r="52"/>
     </svg>
     <div class="foc-mid">
      <span class="foc-time" id="mFocV">25:00</span>
      <span class="foc-status" id="mFocL">TAP TO START</span>
     </div>
    </div>
    <span class="segs" id="mFoc" hidden></span>
    <span class="segs" id="mDay" hidden></span>
    <span id="mDayV" hidden></span>
    <span id="mDayL" hidden></span>
   </button>
  </div>

  <div class="xp" id="xpMk" hidden>
   <div class="xp-h"><b>WATCHLIST</b><button class="chip" id="xpMkEdit" type="button">✎ EDIT</button></div>
   <div class="mk" id="xpMkList"></div>
   <div class="stamp" id="xpMkStamp">UPDATED --</div>
  </div>

  <div class="card br today" id="today">
   <div class="td-ico" aria-hidden="true"><small>TODAY</small><b id="tdDay">—</b></div>
   <button type="button" class="td-item" id="tdCal" aria-label="Open Calendar">
    <span class="td-k">Calendar</span>
    <span class="td-v" id="tdCalV">Open today’s schedule</span>
   </button>
   <button type="button" class="td-item" id="tdNote" aria-label="Open Notes">
    <span class="td-k">Note</span>
    <span class="td-v" id="tdNoteV">Open Notes</span>
   </button>
  </div>

  <div class="card br apps-card">
   <div class="sec-h">APPS <button class="chip" id="dEdit" type="button">✎ EDIT</button></div>
   <div class="apps" id="apps" role="list"></div>
  </div>

  <!-- kept for expand/detail parity; hidden full pages unused in v3.1 one-screen -->
  <div hidden>
   <canvas class="fx" id="fxMain" aria-hidden="true"></canvas>
   <div id="wxPlace"></div><div id="wxTemp"></div><div id="wxIcon"></div><div id="wxCond"></div>
   <div id="wxHL"></div><div id="wxFeels"></div><div id="wxRain"></div><div id="wxWind"></div>
   <div id="wxSun"></div><div id="wxStamp"></div><div id="wxHours"></div><div id="wxDays"></div><div id="wxNote"></div>
   <div id="mkList"></div><div id="mkStamp"></div><div id="editMkBtn"></div><div id="cityBtn"></div>
   <div id="hSunset"></div><div id="hWind"></div><div id="hStatus"></div>
  </div>
 </section>

 <section class="view" id="v-weather" aria-label="Weather" hidden></section>
 <section class="view" id="v-markets" aria-label="Markets" hidden></section>
 </main>

 <nav class="dock" id="hDock" aria-label="Dock">
  <span class="d-tiles" id="dTiles"></span>
 </nav>
 <div class="home-ind" aria-hidden="true"></div>
 <footer class="motto">No face. No hours. Just the shortcut.</footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
 <div class="sheet-h"><b id="sheetTitle">MENU</b><button class="chip" id="sheetClose" aria-label="Close" type="button">✕ CLOSE</button></div>
 <div class="sheet-b" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/os/app.js?v=3.1.0"></script>
</body>
</html>
